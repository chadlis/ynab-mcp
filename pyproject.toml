[project]
name = "ynab-mcp"
version = "0.1.0"
description = "An MCP server exposing the YNAB (You Need A Budget) API to MCP clients."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ynab-mcp = "ynab_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# `cryptography` (a transitive dep of mcp via pyjwt[crypto]) publishes its
# newest release without a prebuilt wheel for some platforms, which forces a
# Rust source build needing a very recent rustc. Constrain it to a version that
# ships a wheel so `uv sync` stays toolchain-free.
constraint-dependencies = ["cryptography<49"]

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
